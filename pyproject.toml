[project]
name = "autotester"
version = "0.1.0"
description = "AI automated end-to-end tester: video/docs to best/worst/edge evals, run in a real browser"
readme = "README.md"
authors = [
    { name = "umesh", email = "umeshsugara@vidysea.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langchain-anthropic>=1.7.0",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.4.0",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.9.0",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
autotester = "autotester:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/autotester/cli.py" = ["B008"]  # typer.Option defaults are the framework idiom

[tool.mypy]
python_version = "3.11"
files = ["src/autotester"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
